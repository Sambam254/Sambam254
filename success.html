<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Received | CareerBoost</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-900 font-sans min-h-screen flex items-center justify-center">

    <div class="max-w-md w-full bg-white p-12 rounded-3xl shadow-2xl border border-gray-100 text-center">
        <div class="w-20 h-20 bg-green-100 text-green-600 rounded-full flex items-center justify-center text-4xl mx-auto mb-8">
            <i class="fas fa-check"></i>
        </div>
        <h1 class="text-3xl font-bold mb-4">Form Submitted!</h1>

            Great! We've received your career details. To finalize your order and start the 4-hour countdown, please complete your payment via PayPal.
        </p>

        <div class="space-y-4">
            <a href="https://www.paypal.me/careerboost" target="_blank" class="block w-full bg-[#0070ba] text-white py-4 rounded-xl font-bold text-lg hover:bg-[#005ea6] transition flex items-center justify-center gap-2">
                <i class="fab fa-paypal"></i>
                Pay via PayPal
            </a>
            
            <div class="pt-6 border-t border-gray-100 mt-6">
                <p class="text-sm text-gray-400 mb-4">
                    Once payment is confirmed, our specialists will begin working on your documents immediately.
                </p>
                <a href="index.html" class="text-primary font-semibold hover:underline">
                    <i class="fas fa-arrow-left mr-2"></i> Back to Homepage
                </a>
            </div>
        </div>
